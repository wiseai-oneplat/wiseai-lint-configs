# 호출 측 .github/workflows/lint.yml에서:
#
# jobs:
#   lint:
#     uses: wiseai-oneplat/wiseai-lint-configs/.github/workflows/reusable-lint.yml@v0.4.1
#     with:
#       languages: 'python,go'
#       rule_packs: all
#       lint_mode: advisory
#       reporter_mode: github-pr-review
#     secrets:
#       reviewdog_token: ${{ secrets.GITHUB_TOKEN }}

name: Shared Lint

on:
  workflow_call:
    inputs:
      languages:
        description: '쉼표 구분 언어/도메인 목록'
        required: true
        type: string
      configs_ref:
        description: '공유 설정 리포 ref (tag/branch)'
        required: false
        type: string
        default: 'v0.4.1'
      rule_packs:
        description: '쉼표 구분 룰 팩 목록: all, security, reliability, style, infra'
        required: false
        type: string
        default: 'all'
      reporter_mode:
        description: 'reviewdog reporter mode'
        required: false
        type: string
        default: 'github-pr-review'
      reviewdog_level:
        description: 'reviewdog comment level'
        required: false
        type: string
        default: 'warning'
      lint_mode:
        description: 'advisory 또는 blocking'
        required: false
        type: string
        default: 'advisory'
      fail_on_error:
        description: 'true면 lint_mode와 무관하게 reviewdog error에서 실패'
        required: false
        type: boolean
        default: false
    secrets:
      reviewdog_token:
        required: true

env:
  REVIEWDOG_REPORTER: ${{ inputs.reporter_mode }}
  REVIEWDOG_LEVEL: ${{ inputs.reviewdog_level }}
  REVIEWDOG_FAIL_ON_ERROR: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}
  SEMGREP_VERSION: '1.164.0'
  AST_GREP_VERSION: '0.43.0'
  STYLELINT_VERSION: '17.12.0'
  STYLELINT_CONFIG_STANDARD_VERSION: '40.0.0'
  KUBECONFORM_VERSION: '0.7.0'

jobs:
  language-matrix:
    runs-on: ubuntu-latest
    outputs:
      semgrep: ${{ steps.resolve.outputs.semgrep }}
      ast_grep: ${{ steps.resolve.outputs.ast_grep }}
      shellcheck: ${{ steps.resolve.outputs.shellcheck }}
      hadolint: ${{ steps.resolve.outputs.hadolint }}
      cppcheck: ${{ steps.resolve.outputs.cppcheck }}
      stylelint: ${{ steps.resolve.outputs.stylelint }}
      yamllint: ${{ steps.resolve.outputs.yamllint }}
      tfsec: ${{ steps.resolve.outputs.tfsec }}
      helm_lint: ${{ steps.resolve.outputs.helm_lint }}
      kubeconform: ${{ steps.resolve.outputs.kubeconform }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - id: resolve
        name: Resolve language jobs
        run: |
          python3 .lint-configs/scripts/resolve-language-jobs.py \
            --languages "${{ inputs.languages }}" \
            --github-output "$GITHUB_OUTPUT"

  semgrep:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.semgrep == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/checkout@v4.3.1
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - uses: reviewdog/action-setup@v1.9.0
      - name: Install semgrep
        run: python3 -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Resolve semgrep rule packs
        run: |
          python3 .lint-configs/scripts/resolve-rule-packs.py \
            --tool semgrep \
            --packs "${{ inputs.rule_packs }}" \
            --root .lint-configs \
            --write-args semgrep-args.txt
      - name: Run semgrep
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          mapfile -t semgrep_args < semgrep-args.txt
          if [ "${#semgrep_args[@]}" -eq 0 ]; then
            echo "No semgrep rules selected for rule_packs=${{ inputs.rule_packs }}"
            exit 0
          fi
          semgrep --metrics off "${semgrep_args[@]}" --sarif --no-error > semgrep.sarif || true
          cat semgrep.sarif | reviewdog -f=sarif -name=semgrep \
            -reporter="${REVIEWDOG_REPORTER}" -level="${REVIEWDOG_LEVEL}" \
            -fail-on-error="${REVIEWDOG_FAIL_ON_ERROR}"
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  ast-grep:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.ast_grep == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/checkout@v4.3.1
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - id: ast_grep_packs
        name: Resolve ast-grep rule packs
        run: |
          python3 .lint-configs/scripts/resolve-rule-packs.py \
            --tool ast-grep \
            --packs "${{ inputs.rule_packs }}" \
            --root .lint-configs \
            --json > ast-grep-packs.json
          python3 .lint-configs/scripts/resolve-rule-packs.py \
            --tool ast-grep \
            --packs "${{ inputs.rule_packs }}" \
            --root .lint-configs \
            --write-config ast-grep-pack-sgconfig.yml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          paths = json.loads(open("ast-grep-packs.json").read())["paths"]
          print(f"selected={'true' if paths else 'false'}")
          PY
      - uses: ast-grep/action@v1.5.0
        if: steps.ast_grep_packs.outputs.selected == 'true'
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        with:
          version: ${{ env.AST_GREP_VERSION }}
          config: ast-grep-pack-sgconfig.yml

  shellcheck:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.shellcheck == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: reviewdog/action-shellcheck@v1.9.0
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  hadolint:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.hadolint == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: reviewdog/action-hadolint@v1.9.0
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  cppcheck:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.cppcheck == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - uses: reviewdog/action-setup@v1.9.0
      - name: Run cppcheck
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          cppcheck --enable=warning,style,performance --inline-suppr --quiet \
            --template='{file}:{line}:{column}: {severity}: {message}' . 2> cppcheck.out || true
          cat cppcheck.out | reviewdog -efm="%f:%l:%c: %t%*[^:]: %m" -name=cppcheck \
            -reporter="${REVIEWDOG_REPORTER}" -level="${REVIEWDOG_LEVEL}" \
            -fail-on-error="${REVIEWDOG_FAIL_ON_ERROR}"
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  stylelint:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.stylelint == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install stylelint
        run: npm install -g "stylelint@${STYLELINT_VERSION}" "stylelint-config-standard@${STYLELINT_CONFIG_STANDARD_VERSION}"
      - uses: reviewdog/action-setup@v1.9.0
      - name: Run stylelint
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          npx stylelint "**/*.{css,scss,sass,less}" --formatter compact > stylelint.out || true
          cat stylelint.out | reviewdog -efm="%f: line %l, col %c, %t%*[^-]- %m" \
            -name=stylelint -reporter="${REVIEWDOG_REPORTER}" -level="${REVIEWDOG_LEVEL}" \
            -fail-on-error="${REVIEWDOG_FAIL_ON_ERROR}"
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  yamllint:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.yamllint == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: reviewdog/action-yamllint@v1.9.0
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  tfsec:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.tfsec == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: reviewdog/action-tfsec@v1.9.0
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  helm-lint:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.helm_lint == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: azure/setup-helm@v4.3.1
      - name: Run helm lint
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          : > helm-lint.out
          failed=0
          while IFS= read -r -d '' chart; do
            dir=$(dirname "$chart")
            echo "Linting $dir" | tee -a helm-lint.out
            helm lint "$dir" 2>&1 | tee -a helm-lint.out || failed=1
          done < <(find . -name 'Chart.yaml' -print0)
          {
            echo "### helm lint"
            cat helm-lint.out
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REVIEWDOG_FAIL_ON_ERROR" = "true" ] && [ "$failed" -ne 0 ]; then
            exit 1
          fi

  kubeconform:
    runs-on: ubuntu-latest
    needs: language-matrix
    if: needs.language-matrix.outputs.kubeconform == 'true'
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          mapfile -d '' manifests < <(find . \( -path '*/manifest/*.yaml' -o -path '*/templates/*.yaml' \) -print0)
          status=0
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests found" | tee kubeconform.out
          else
            kubeconform -summary -strict "${manifests[@]}" 2>&1 | tee kubeconform.out || status=$?
          fi
          {
            echo "### kubeconform"
            cat kubeconform.out
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REVIEWDOG_FAIL_ON_ERROR" = "true" ] && [ "$status" -ne 0 ]; then
            exit "$status"
          fi
