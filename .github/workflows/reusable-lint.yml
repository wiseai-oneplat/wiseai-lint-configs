# 호출 측 .github/workflows/lint.yml에서:
#
# jobs:
#   lint:
#     uses: wiseai-oneplat/wiseai-lint-configs/.github/workflows/reusable-lint.yml@v0.4.1
#     with:
#       languages: 'python,go'
#       lint_mode: advisory
#       reporter_mode: github-pr-review
#     secrets:
#       reviewdog_token: ${{ secrets.GITHUB_TOKEN }}

name: Shared Lint

on:
  workflow_call:
    inputs:
      languages:
        description: '쉼표 구분 언어/도메인 목록'
        required: true
        type: string
      configs_ref:
        description: '공유 설정 리포 ref (tag/branch)'
        required: false
        type: string
        default: 'v0.4.1'
      reporter_mode:
        description: 'reviewdog reporter mode'
        required: false
        type: string
        default: 'github-pr-review'
      reviewdog_level:
        description: 'reviewdog comment level'
        required: false
        type: string
        default: 'warning'
      lint_mode:
        description: 'advisory 또는 blocking'
        required: false
        type: string
        default: 'advisory'
      fail_on_error:
        description: 'true면 lint_mode와 무관하게 reviewdog error에서 실패'
        required: false
        type: boolean
        default: false
    secrets:
      reviewdog_token:
        required: true

env:
  REVIEWDOG_REPORTER: ${{ inputs.reporter_mode }}
  REVIEWDOG_LEVEL: ${{ inputs.reviewdog_level }}
  REVIEWDOG_FAIL_ON_ERROR: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',python,') || contains(format(',{0},', inputs.languages), ',go,') || contains(format(',{0},', inputs.languages), ',java,') || contains(format(',{0},', inputs.languages), ',typescript,') || contains(format(',{0},', inputs.languages), ',javascript,') || contains(format(',{0},', inputs.languages), ',c,') || contains(format(',{0},', inputs.languages), ',cpp,') || contains(format(',{0},', inputs.languages), ',terraform,') || contains(format(',{0},', inputs.languages), ',kubernetes,') || contains(format(',{0},', inputs.languages), ',helm,')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - uses: reviewdog/action-setup@v1
      - run: pip install semgrep
      - name: Run semgrep
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          semgrep --metrics off --config .lint-configs/semgrep/rules/ --sarif --no-error > semgrep.sarif || true
          cat semgrep.sarif | reviewdog -f=sarif -name=semgrep \
            -reporter="${REVIEWDOG_REPORTER}" -level="${REVIEWDOG_LEVEL}" \
            -fail-on-error="${REVIEWDOG_FAIL_ON_ERROR}"
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  ast-grep:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',python,') || contains(format(',{0},', inputs.languages), ',go,') || contains(format(',{0},', inputs.languages), ',java,') || contains(format(',{0},', inputs.languages), ',typescript,') || contains(format(',{0},', inputs.languages), ',javascript,') || contains(format(',{0},', inputs.languages), ',vue,') || contains(format(',{0},', inputs.languages), ',c,') || contains(format(',{0},', inputs.languages), ',cpp,') || contains(format(',{0},', inputs.languages), ',css,')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - uses: ast-grep/action@v1
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        with:
          config: .lint-configs/ast-grep/sgconfig.yml

  shellcheck:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',shell,')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  hadolint:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',dockerfile,')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-hadolint@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  cppcheck:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',c,') || contains(format(',{0},', inputs.languages), ',cpp,')
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - uses: reviewdog/action-setup@v1
      - name: Run cppcheck
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          cppcheck --enable=warning,style,performance --inline-suppr --quiet \
            --template='{file}:{line}:{column}: {severity}: {message}' . 2> cppcheck.out || true
          cat cppcheck.out | reviewdog -efm="%f:%l:%c: %t%*[^:]: %m" -name=cppcheck \
            -reporter="${REVIEWDOG_REPORTER}" -level="${REVIEWDOG_LEVEL}" \
            -fail-on-error="${REVIEWDOG_FAIL_ON_ERROR}"
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  stylelint:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',css,')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard
      - uses: reviewdog/action-setup@v1
      - name: Run stylelint
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          npx stylelint "**/*.{css,scss,sass,less}" --formatter compact > stylelint.out || true
          cat stylelint.out | reviewdog -efm="%f: line %l, col %c, %t%*[^-]- %m" \
            -name=stylelint -reporter="${REVIEWDOG_REPORTER}" -level="${REVIEWDOG_LEVEL}" \
            -fail-on-error="${REVIEWDOG_FAIL_ON_ERROR}"
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  yamllint:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',yaml,')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-yamllint@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  tfsec:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',terraform,')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-tfsec@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: ${{ inputs.reporter_mode }}
          level: ${{ inputs.reviewdog_level }}
          fail_on_error: ${{ inputs.fail_on_error || inputs.lint_mode == 'blocking' }}

  helm-lint:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',helm,')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Run helm lint
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          : > helm-lint.out
          failed=0
          while IFS= read -r -d '' chart; do
            dir=$(dirname "$chart")
            echo "Linting $dir" | tee -a helm-lint.out
            helm lint "$dir" 2>&1 | tee -a helm-lint.out || failed=1
          done < <(find . -name 'Chart.yaml' -print0)
          {
            echo "### helm lint"
            cat helm-lint.out
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REVIEWDOG_FAIL_ON_ERROR" = "true" ] && [ "$failed" -ne 0 ]; then
            exit 1
          fi

  kubeconform:
    runs-on: ubuntu-latest
    if: contains(format(',{0},', inputs.languages), ',kubernetes,') || contains(format(',{0},', inputs.languages), ',helm,')
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        continue-on-error: ${{ inputs.lint_mode == 'advisory' && inputs.fail_on_error == false }}
        run: |
          mapfile -d '' manifests < <(find . \( -path '*/manifest/*.yaml' -o -path '*/templates/*.yaml' \) -print0)
          status=0
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests found" | tee kubeconform.out
          else
            kubeconform -summary -strict "${manifests[@]}" 2>&1 | tee kubeconform.out || status=$?
          fi
          {
            echo "### kubeconform"
            cat kubeconform.out
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REVIEWDOG_FAIL_ON_ERROR" = "true" ] && [ "$status" -ne 0 ]; then
            exit "$status"
          fi
