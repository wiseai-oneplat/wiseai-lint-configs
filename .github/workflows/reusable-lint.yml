# 호출 측 .github/workflows/lint.yml에서:
#
# jobs:
#   lint:
#     uses: wiseai-oneplat/wiseai-lint-configs/.github/workflows/reusable-lint.yml@v0.4.0
#     with:
#       languages: 'python,go'   # 쉼표 구분
#                                # 옵션: python, go, java, typescript, javascript, vue,
#                                #       c, cpp, css, shell, dockerfile, terraform,
#                                #       kubernetes, helm, yaml
#     secrets:
#       reviewdog_token: ${{ secrets.GITHUB_TOKEN }}

name: Shared Lint

on:
  workflow_call:
    inputs:
      languages:
        description: '쉼표 구분 언어/도메인 목록'
        required: true
        type: string
      configs_ref:
        description: '공유 설정 리포 ref (tag/branch)'
        required: false
        type: string
        default: 'v0.4.0'
    secrets:
      reviewdog_token:
        required: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'python') || contains(inputs.languages, 'go') || contains(inputs.languages, 'java') || contains(inputs.languages, 'typescript') || contains(inputs.languages, 'javascript') || contains(inputs.languages, 'c') || contains(inputs.languages, 'cpp') || contains(inputs.languages, 'terraform') || contains(inputs.languages, 'kubernetes') || contains(inputs.languages, 'helm')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - uses: reviewdog/action-setup@v1
      - run: pip install semgrep
      - name: Run semgrep
        continue-on-error: true
        run: |
          semgrep --config .lint-configs/semgrep/rules/ --sarif --no-error > semgrep.sarif || true
          cat semgrep.sarif | reviewdog -f=sarif -name=semgrep -reporter=github-pr-review -level=warning -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  ast-grep:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'python') || contains(inputs.languages, 'go') || contains(inputs.languages, 'java') || contains(inputs.languages, 'typescript') || contains(inputs.languages, 'javascript') || contains(inputs.languages, 'vue') || contains(inputs.languages, 'c') || contains(inputs.languages, 'cpp') || contains(inputs.languages, 'css')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wiseai-oneplat/wiseai-lint-configs
          ref: ${{ inputs.configs_ref }}
          path: .lint-configs
      - uses: ast-grep/action@v1
        continue-on-error: true
        with:
          config: .lint-configs/ast-grep/sgconfig.yml

  shellcheck:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'shell')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: github-pr-review
          level: warning

  hadolint:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'dockerfile')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-hadolint@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: github-pr-review

  cppcheck:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'c') || contains(inputs.languages, 'cpp')
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - uses: reviewdog/action-setup@v1
      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,performance --inline-suppr --quiet \
            --template='{file}:{line}:{column}: {severity}: {message}' . 2> cppcheck.out || true
          cat cppcheck.out | reviewdog -efm="%f:%l:%c: %t%*[^:]: %m" -name=cppcheck \
            -reporter=github-pr-review -level=warning -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  stylelint:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'css')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard
      - uses: reviewdog/action-setup@v1
      - name: Run stylelint
        continue-on-error: true
        run: |
          npx stylelint "**/*.{css,scss,sass,less}" --formatter compact > stylelint.out || true
          cat stylelint.out | reviewdog -efm="%f: line %l, col %c, %t%*[^-]- %m" \
            -name=stylelint -reporter=github-pr-review -level=warning -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}

  yamllint:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'yaml')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-yamllint@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: github-pr-review
          level: warning

  tfsec:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'terraform')
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-tfsec@v1
        with:
          github_token: ${{ secrets.reviewdog_token }}
          reporter: github-pr-review
          level: warning

  helm-lint:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'helm')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Run helm lint
        continue-on-error: true
        run: |
          find . -name 'Chart.yaml' -print0 | while IFS= read -r -d '' chart; do
            dir=$(dirname "$chart")
            echo "Linting $dir"
            helm lint "$dir" || true
          done

  kubeconform:
    runs-on: ubuntu-latest
    if: contains(inputs.languages, 'kubernetes') || contains(inputs.languages, 'helm')
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        continue-on-error: true
        run: |
          find . \( -path '*/manifest/*.yaml' -o -path '*/templates/*.yaml' \) -print0 \
            | xargs -0 kubeconform -summary -strict || true
