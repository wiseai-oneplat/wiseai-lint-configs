# pre-commit remote repo로 참조 가능한 hooks
# 호출 측 .pre-commit-config.yaml 예시:
#   - repo: https://github.com/wiseai-oneplat/wiseai-lint-configs
#     rev: v0.4.5
#     hooks:
#       - id: semgrep-shared
#       - id: ast-grep-shared
#       - id: shellcheck-shared      # *.sh가 있는 저장소만
#       - id: hadolint-shared        # Dockerfile이 있는 저장소만
#       - id: yamllint-shared        # YAML 검사 원할 시

- id: semgrep-shared
  name: shared semgrep rules
  description: Run wiseai shared semgrep rules.
  entry: pre-commit/run-semgrep-shared.sh
  language: script
  pass_filenames: false
  types: [text]
  minimum_pre_commit_version: '3.5.0'

- id: ast-grep-shared
  name: shared ast-grep rules
  description: Run wiseai shared ast-grep rules.
  entry: pre-commit/run-ast-grep-shared.sh
  language: script
  pass_filenames: false
  types: [text]
  minimum_pre_commit_version: '3.5.0'

- id: shellcheck-shared
  name: shellcheck (shared)
  description: Run shellcheck with the caller repository shell files.
  entry: shellcheck
  language: system
  types: [shell]
  minimum_pre_commit_version: '3.5.0'

- id: hadolint-shared
  name: hadolint (shared)
  description: Run hadolint for Dockerfiles.
  entry: hadolint
  language: system
  files: '(^|/)Dockerfile(\..*)?$'
  minimum_pre_commit_version: '3.5.0'

- id: yamllint-shared
  name: yamllint (shared)
  description: Run yamllint for YAML files.
  entry: yamllint
  language: system
  types: [yaml]
  minimum_pre_commit_version: '3.5.0'
