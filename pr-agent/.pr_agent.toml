# PR-Agent (qodo-merge) 공유 설정
# 각 저장소에 복사하거나 git submodule로 참조.

[config]
model = "claude-opus-4-7"
fallback_models = ["claude-sonnet-4-6"]
language = "ko"
verbosity_level = 2
publish_output = true
publish_output_progress = false

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_security_review = true
require_focused_review = false
num_code_suggestions = 4
extra_instructions = """
한국어로 리뷰하세요.

[공통 점검 사항]
- 시크릿/PII 하드코딩 (API key, 토큰, 비밀번호, 주민번호, 의료기록 등) 여부
- 의료법/개인정보 관련 컴플라이언스 (한국 의료 도메인 코드인 경우)
- 외부 호출/결제/예약 변경 시 idempotency key 유무
- 비동기 안전성: context 전파, race condition, goroutine/Promise leak
- 타임아웃·재시도·백오프 정책 누락
- 트랜잭션 경계 침범, RuntimeException 무시
- 컨테이너 이미지에 latest 태그, privileged: true, hostNetwork: true 등 위험 설정

[리뷰 톤]
- 결정적인 버그/보안 위협은 ERROR로 명확히
- 스타일/가독성은 SUGGESTION으로 부드럽게
- 표준 린터(ruff, mypy, golangci-lint, biome, SpotBugs, shellcheck, hadolint, tfsec, kubeconform)로
  이미 잡히는 룰은 중복 제안 금지
- 도메인 로직 개선과 안전성 위주로 제안
"""

[pr_description]
add_original_user_description = true
generate_ai_title = false
publish_labels = true

[pr_code_suggestions]
num_code_suggestions = 4
extra_instructions = """
- 표준 린터가 잡는 항목은 중복 제안 금지
- 비즈니스 로직 개선·안전성 위주
- C/C++ 코드에서는 메모리 안전성, 포인터, undefined behavior에 우선 주목
- 프론트엔드 코드에서는 접근성, 성능 (re-render, large payload) 에 주목
- 인프라 코드(Terraform/K8s/Helm)에서는 권한/네트워크/시크릿 노출에 주목
"""

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = false
